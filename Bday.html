<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Surprise ❤️</title>

<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- PAGE 1 -->

<div class="page active" id="page1">

<h1>I made something for you 🎁</h1>

<img src="images/pic1.jpg" class="dog">

<div class="buttons">
<button onclick="showPage(4)">Yes ❤️</button>
<button onclick="showPage(2)">No 😒</button>
</div>

</div>

<!-- PAGE 2 -->

<div class="page" id="page2">

<h1>Seriously? 😤</h1>

<img src="images/pic2.jpg" class="dog">

<button onclick="showPage(1)">Go Back</button>

</div>

<!-- PAGE 3 -->

<div class="page" id="page3">

<h1>That's a Good Girl ❤️</h1>

<img src="images/pic3.jpg" class="heart">

<button onclick="showPage(4)">Click</button>

</div>

<!-- PAGE 4 -->

<div class="page" id="page4">

<h1>🎉 HAPPY BIRTHDAY 🎉</h1>

<button onclick="showPage(5)">Next ➜</button>

</div>

<!-- PAGE 5 -->

<div class="page" id="page5">

<h2>Click Any Item</h2>

<div class="menu">

<div class="card" onclick="showPage(6)">
📸 Memories
</div>

<div class="card" onclick="showPage(7)">
💌 Letter
</div>

<div class="card" onclick="showPage(8)">
🎵 Music
</div>

</div>

</div>

<!-- PAGE 6 MEMORIES -->

<div class="page" id="page6">

<h1>Our Memories ❤️</h1>

<div class="gallery">

<img src="images/pic1.jpg">
<img src="images/pic2.jpg">
<img src="images/pic3.jpg">
<img src="images/pic4.jpg">
<img src="images/pic5.jpg">
<img src="images/pic6.jpg">

</div>

<button onclick="showPage(5)">Back</button>

</div>

<!-- PAGE 7 LETTER -->

<div class="page" id="page7">

<div class="letter">

<h2>Happy Birthday ❤️</h2>

<p>
You are the most amazing person.
May all your dreams come true.
Stay happy, healthy and blessed.
</p>

</div>

<button onclick="showPage(5)">Back</button>

</div>

<!-- PAGE 8 MUSIC -->

<div class="page" id="page8">

<h1>Special Song 🎵</h1>

<audio controls autoplay>
<source src="music/birthday.mp3">
</audio>

<button onclick="showPage(5)">Back</button>

</div>

<script src="script.js"></script>

</body>
</html>
