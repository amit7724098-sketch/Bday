<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Birthday Surprise ❤️</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:linear-gradient(135deg,#fff8d6,#f6e7ff);
overflow:hidden;
}

.page{
position:absolute;
top:0;
left:0;
width:100%;
height:100vh;

display:flex;
flex-direction:column;
justify-content:center;
align-items:center;

padding:20px;
text-align:center;

opacity:0;
visibility:hidden;
transform:translateX(100%);
transition:.8s;
}

.page.active{
opacity:1;
visibility:visible;
transform:translateX(0);
}

h1{
color:#7d3cff;
margin-bottom:20px;
}

img{
width:220px;
height:220px;
object-fit:cover;
border-radius:20px;
box-shadow:0 10px 25px rgba(0,0,0,.2);
}

.buttons{
display:flex;
gap:15px;
margin-top:20px;
}

button{
padding:12px 25px;
border:none;
border-radius:30px;
background:#8b5cf6;
color:white;
font-size:18px;
cursor:pointer;
}

button:hover{
transform:scale(1.05);
}

.gallery{
display:grid;
grid-template-columns:repeat(2,150px);
gap:10px;
margin-top:20px;
}

.gallery img{
width:150px;
height:150px;
}

.menu{
display:flex;
gap:20px;
flex-wrap:wrap;
justify-content:center;
}

.card{
background:white;
padding:20px;
border-radius:20px;
box-shadow:0 10px 20px rgba(0,0,0,.15);
cursor:pointer;
transition:.3s;
}

.card:hover{
transform:translateY(-5px);
}

.letter{
max-width:700px;
background:white;
padding:25px;
border-radius:20px;
box-shadow:0 10px 20px rgba(0,0,0,.15);
}

.floating{
position:absolute;
font-size:30px;
animation:float 5s linear infinite;
}

@keyframes float{
0%{
transform:translateY(100vh);
opacity:0;
}
20%{
opacity:1;
}
100%{
transform:translateY(-100px);
opacity:0;
}
}

</style>
</head>
<body>

<!-- PAGE 1 -->

<div class="page active" id="page1">

<h1>I Made Something For You 🎁</h1>

<img src="https://picsum.photos/300/300">

<div class="buttons">
<button onclick="showPage(3)">Yes ❤️</button>
<button onclick="showPage(2)">No 😒</button>
</div>

</div>

<!-- PAGE 2 -->

<div class="page" id="page2">

<h1>Seriously? 😤</h1>

<img src="https://picsum.photos/301/301">

<br><br>

<button onclick="showPage(1)">Go Back</button>

</div>

<!-- PAGE 3 -->

<div class="page" id="page3">

<h1>That's A Good Girl ❤️</h1>

<img src="https://picsum.photos/302/302">

<br><br>

<button onclick="showPage(4)">Click</button>

</div>

<!-- PAGE 4 -->

<div class="page" id="page4">

<h1>🎉 HAPPY BIRTHDAY 🎉</h1>

<button onclick="showPage(5)">Next ➜</button>

</div>

<!-- PAGE 5 -->

<div class="page" id="page5">

<h1>Choose One ❤️</h1>

<div class="menu">

<div class="card" onclick="showPage(6)">
📸 Memories
</div>

<div class="card" onclick="showPage(7)">
💌 Letter
</div>

<div class="card" onclick="showPage(8)">
🎵 Music
</div>

</div>

</div>

<!-- MEMORIES -->

<div class="page" id="page6">

<h1>Our Memories ❤️</h1>

<div class="gallery">

<img src="https://picsum.photos/200?1">
<img src="https://picsum.photos/200?2">
<img src="https://picsum.photos/200?3">
<img src="https://picsum.photos/200?4">

</div>

<br>

<button onclick="showPage(5)">Back</button>

</div>

<!-- LETTER -->

<div class="page" id="page7">

<div class="letter">

<h2>Happy Birthday ❤️</h2>

<p>
May all your dreams come true.
Stay happy, healthy and blessed.
Thank you for always being special.
</p>

</div>

<br>

<button onclick="showPage(5)">Back</button>

</div>

<!-- MUSIC -->

<div class="page" id="page8">

<h1>Special Song 🎵</h1>

<audio controls>
<source src="">
</audio>

<br><br>

<button onclick="showPage(5)">Back</button>

</div>

<script>

function showPage(pageNo){

document.querySelectorAll('.page').forEach(page=>{
page.classList.remove('active');
});

document.getElementById('page'+pageNo).classList.add('active');

}

setInterval(()=>{

let heart=document.createElement('div');

heart.className='floating';
heart.innerHTML='❤️';

heart.style.left=Math.random()*100+'vw';

document.body.appendChild(heart);

setTimeout(()=>{
heart.remove();
},5000);

},500);

</script>

</body>
</html>
