<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Neha ❤️</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
overflow-x:hidden;
background:linear-gradient(-45deg,#6a11cb,#2575fc,#ffd700,#ff69b4);
background-size:400% 400%;
animation:bgMove 12s ease infinite;
min-height:100vh;
color:white;
}

@keyframes bgMove{
0%{background-position:0% 50%}
50%{background-position:100% 50%}
100%{background-position:0% 50%}
}

.floating{
position:fixed;
width:100%;
height:100%;
pointer-events:none;
overflow:hidden;
z-index:1;
}

.heart,.star{
position:absolute;
font-size:24px;
animation:float 10s linear infinite;
opacity:.8;
}

@keyframes float{
from{
transform:translateY(100vh) rotate(0deg);
}
to{
transform:translateY(-120vh) rotate(360deg);
}
}

.center{
display:flex;
justify-content:center;
align-items:center;
height:100vh;
flex-direction:column;
position:relative;
z-index:5;
}

.envelope{
width:250px;
height:180px;
background:#fff;
position:relative;
cursor:pointer;
border-radius:8px;
box-shadow:0 0 40px rgba(255,255,255,.4);
}

.flap{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
background:#ff69b4;
clip-path:polygon(0 0,100% 0,50% 60%);
transform-origin:top;
transition:1s;
}

.open .flap{
transform:rotateX(180deg);
}

.click{
margin-top:30px;
font-size:22px;
font-weight:bold;
}

.hidden{
display:none;
}

.section{
padding:40px 20px;
text-align:center;
position:relative;
z-index:5;
}

h1{
font-size:50px;
margin-bottom:15px;
text-shadow:0 0 20px white;
}

.question{
font-size:28px;
margin:30px 0;
}

.btns{
position:relative;
height:150px;
}

button{
border:none;
padding:15px 35px;
font-size:20px;
border-radius:50px;
cursor:pointer;
margin:15px;
font-weight:bold;
transition:.3s;
}

.yes{
background:#00ff99;
}

.no{
background:#ff4444;
position:absolute;
}

.polaroids{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:20px;
margin-top:30px;
}

.card{
background:white;
padding:10px;
width:220px;
border-radius:12px;
box-shadow:0 0 20px rgba(255,255,255,.4);
transform:rotate(-3deg);
}

.card:nth-child(even){
transform:rotate(4deg);
}

.card img{
width:100%;
height:220px;
object-fit:cover;
border-radius:8px;
}

.card p{
color:black;
font-weight:bold;
margin-top:8px;
}

.letter{
max-width:900px;
margin:auto;
font-size:22px;
line-height:1.8;
padding:30px;
background:rgba(255,255,255,.15);
backdrop-filter:blur(10px);
border-radius:20px;
margin-top:30px;
min-height:250px;
}

canvas{
position:fixed;
top:0;
left:0;
pointer-events:none;
z-index:999;
}

@media(max-width:768px){

h1{
font-size:34px;
}

.card{
width:160px;
}

.card img{
height:160px;
}

.letter{
font-size:18px;
}
}
</style>
</head>
<body>

<canvas id="confetti"></canvas>

<div class="floating" id="floating"></div>

<div class="center" id="firstPage">

<div class="envelope" id="env">
<div class="flap"></div>
</div>

<div class="click">💌 Tap Envelope For Surprise Neha 💌</div>

</div>

<div id="mainContent" class="hidden">

<section class="section">

<h1>🎂 Happy Birthday Neha ❤️ 🎂</h1>

<p style="font-size:24px">
A Special Surprise For The Most Amazing Girl ✨
</p>

<div class="question">
Do You Want To Open Your Birthday Gift? 🎁
</div>

<div class="btns">

<button class="yes" onclick="showGallery()">
Yes ❤️
</button>

<button class="no" id="noBtn">
No 😜
</button>

</div>

</section>

<section class="section hidden" id="gallerySection">

<h1>📸 Beautiful Memories 📸</h1>

<div class="polaroids">

<div class="card">
<img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=600">
<p>Always Shine ✨</p>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1517841905240-472988babdf9?w=600">
<p>Best Smile ❤️</p>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=600">
<p>Stay Happy 🌸</p>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1488426862026-3ee34a7d66df?w=600">
<p>Dream Big ⭐</p>
</div>

</div>

<div class="letter">
<span id="typewriter"></span>
</div>

</section>

</div>

<script>

const floating=document.getElementById('floating');

for(let i=0;i<40;i++){

let item=document.createElement('div');

item.className=Math.random()>0.5?'heart':'star';

item.innerHTML=Math.random()>0.5?'💜':'⭐';

item.style.left=Math.random()*100+'%';

item.style.animationDuration=(6+Math.random()*8)+'s';

item.style.fontSize=(15+Math.random()*25)+'px';

floating.appendChild(item);

}

document.getElementById("env").onclick=function(){

this.classList.add("open");

setTimeout(()=>{
document.getElementById("firstPage").style.display="none";
document.getElementById("mainContent").classList.remove("hidden");
},1000);

};

const noBtn=document.getElementById('noBtn');

noBtn.addEventListener('mouseover',()=>{

const x=Math.random()*250;
const y=Math.random()*100;

noBtn.style.left=x+'px';
noBtn.style.top=y+'px';

});

function showGallery(){

document.getElementById('gallerySection').classList.remove('hidden');

window.scrollTo({
top:document.body.scrollHeight,
behavior:'smooth'
});

confettiBlast();
typeMessage();

}

let started=false;

function typeMessage(){

if(started) return;
started=true;

const text=`Happy Birthday to the most amazing girl and my favorite person! 🎂💖

You make every day brighter just by being yourself. Thank you for all the laughs, the memories, and the countless moments that make our friendship so special. I’m really lucky to have a best friend like you.

May your smile never fade, your dreams come true, and your life be filled with happiness, success, and love. Keep shining, keep being kind, and keep being the wonderful person you are.

Enjoy your special day to the fullest because you deserve all the happiness in the world.

Happy Birthday, Bestie! 🎉✨💕`;

let i=0;

function typing(){

if(i<text.length){

document.getElementById("typewriter").innerHTML+=text.charAt(i);

i++;

setTimeout(typing,35);

}

}

typing();

}

function confettiBlast(){

const canvas=document.getElementById('confetti');
const ctx=canvas.getContext('2d');

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

const confetti=[];

for(let i=0;i<250;i++){

confetti.push({

x:Math.random()*canvas.width,
y:Math.random()*canvas.height-canvas.height,
r:Math.random()*8+2,
d:Math.random()*250

});

}

function draw(){

ctx.clearRect(0,0,canvas.width,canvas.height);

for(let i=0;i<confetti.length;i++){

const c=confetti[i];

ctx.beginPath();

ctx.arc(c.x,c.y,c.r,0,Math.PI*2);

ctx.fillStyle=`hsl(${Math.random()*360},100%,60%)`;

ctx.fill();

c.y+=3;

if(c.y>canvas.height){
c.y=-10;
}

}

requestAnimationFrame(draw);

}

draw();

}

</script>

</body>
</html>
